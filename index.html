<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamakiのホームページ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 2.5rem; }
        h2 { color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 0.5rem; }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #2c3e50;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website!</h1>
        <p>GitHub Pagesで作成中のホームページです</p>
    </header>

    <main>
        <div class="card">
            <h2>自己紹介</h2>
            <p>はじめまして！新しくホームページを作成し始めました。</p>
            <p>これからHTMLやCSSを少しずつ勉強して、自分だけのオリジナルサイトにアップデートしていく予定です。</p>
            
            <h2>これからの目標</h2>
            <ul>
                <li>デザインをもっとカッコよくする</li>
                <li>お気に入りの画像やリンクを載せる</li>
                <li>スマホで見やすく調整する</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 tamaki_Hp</p>
    </footer>

</body>
</html>
